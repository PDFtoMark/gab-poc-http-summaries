name: Health
on:
  pull_request:
    branches: [ main ]
jobs:
  h:
    runs-on: ubuntu-latest
    steps:
      - name: payload-dump
        run: |
          echo "HEALTH_HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}"
          mkdir -p out
          printf 'FORGED-ARTIFACT-CONTENT-via-post_summaries\n' > out/comment.md
          echo "${{ github.event.pull_request.number }}" > out/issueNumber
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: out/
